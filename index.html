<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>
<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0c0e14;
    color: #e2e4ed;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #chat-box {
    width: 100%;
    max-width: 700px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #13151f;
    border-left: 1px solid #22253a;
    border-right: 1px solid #22253a;
  }

  /* ── Header ── */
  .header {
    padding: 14px 18px;
    background: #181b28;
    border-bottom: 1px solid #22253a;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #6c63ff, #00c9a7);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .header h1 { font-size: 15px; font-weight: 600; }
  .header-sub { font-size: 11px; color: #555d7a; margin-left: auto; }

  /* ── Mode tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
    background: #181b28;
    border-bottom: 1px solid #22253a;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .tab {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid #22253a;
    background: transparent;
    color: #666d8a;
    transition: all 0.18s;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
    width: auto; height: auto;
    font-family: inherit;
  }

  .tab:hover { color: #c0c4d8; border-color: #3a3f5c; }
  .tab.active { background: #6c63ff20; border-color: #6c63ff; color: #a89fff; }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #22253a; border-radius: 4px; }

  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
  }

  .msg.ai .avatar { background: linear-gradient(135deg, #6c63ff, #00c9a7); color: #fff; font-size: 15px; }
  .msg.user .avatar { background: #22253a; color: #888; font-size: 11px; }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.65;
    word-break: break-word;
  }

  .msg.ai .bubble {
    background: #1c1f2e;
    border: 1px solid #22253a;
    border-top-left-radius: 4px;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: #6c63ff;
    color: #fff;
    border-top-right-radius: 4px;
    white-space: pre-wrap;
  }

  .model-tag {
    font-size: 10px;
    color: #2e3453;
    margin-top: 4px;
    padding-left: 2px;
  }

  /* image result */
  .img-bubble { max-width: 80%; }

  .img-bubble img {
    width: 100%;
    max-width: 340px;
    border-radius: 12px;
    border: 1px solid #22253a;
    display: block;
    margin-top: 4px;
  }

  .dl-btn {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 8px;
    padding: 5px 12px;
    background: #22253a;
    border: 1px solid #2e3350;
    border-radius: 7px;
    color: #a0a6c0;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.18s;
    width: auto; height: auto;
    font-family: inherit;
  }

  .dl-btn:hover { border-color: #6c63ff; color: #a89fff; background: #6c63ff18; }

  /* audio result */
  .audio-bubble {
    max-width: 80%;
    background: #1c1f2e;
    border: 1px solid #22253a;
    border-radius: 14px;
    border-top-left-radius: 4px;
    padding: 12px 14px;
  }

  .audio-label { font-size: 11px; color: #555d7a; margin-bottom: 8px; }
  .audio-bubble audio { width: 100%; height: 36px; }

  /* typing */
  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #6c63ff; display: block;
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1.15); }
  }

  /* ── Input area ── */
  .input-wrap {
    padding: 12px 14px 14px;
    border-top: 1px solid #22253a;
    background: #181b28;
    flex-shrink: 0;
  }

  .extra-opts {
    display: none;
    gap: 8px;
    margin-bottom: 9px;
    flex-wrap: wrap;
    align-items: center;
  }

  .extra-opts.show { display: flex; }

  .extra-opts label { font-size: 11px; color: #555d7a; }

  select {
    background: #13151f;
    border: 1px solid #22253a;
    border-radius: 8px;
    color: #a0a6c0;
    font-size: 12px;
    padding: 5px 10px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }

  select:focus { border-color: #6c63ff55; }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    background: #0c0e14;
    border: 1px solid #22253a;
    border-radius: 11px;
    color: #e2e4ed;
    font-size: 14px;
    font-family: inherit;
    padding: 10px 13px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 130px;
    line-height: 1.5;
    transition: border-color 0.18s;
  }

  textarea:focus { border-color: #6c63ff55; }
  textarea::placeholder { color: #2e3453; }

  #send-btn {
    width: 44px; height: 44px;
    background: #6c63ff;
    border: none;
    border-radius: 11px;
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.18s, transform 0.1s;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }

  #send-btn:hover:not(:disabled) { background: #7c75ff; transform: scale(1.05); }
  #send-btn:disabled { background: #1e2130; color: #2e3453; cursor: default; transform: none; }

  .hint {
    font-size: 10.5px;
    color: #22253a;
    margin-top: 7px;
    text-align: center;
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .bubble { max-width: 88%; font-size: 13px; }
    .tabs { padding: 8px 10px; gap: 3px; }
    .tab { padding: 5px 9px; font-size: 11px; }
    .img-bubble img { max-width: 260px; }
  }
</style>
</head>
<body>

<div id="chat-box">

  <!-- Header -->
  <div class="header">
    <div class="logo">✦</div>
    <h1>AI Chatbot</h1>
    <span class="header-sub">Powered by Puter.js · Free</span>
  </div>

  <!-- Mode tabs -->
  <div class="tabs">
    <button class="tab active" data-mode="chat">💬 Chat</button>
    <button class="tab" data-mode="image">🎨 Image Gen</button>
    <button class="tab" data-mode="code">💻 Code</button>
    <button class="tab" data-mode="search">🔍 Web Search</button>
    <button class="tab" data-mode="tts">🔊 Text→Speech</button>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="msg ai">
      <div class="avatar">✦</div>
      <div>
        <div class="bubble">Hi! I'm your AI assistant. Pick a mode from the tabs above and ask me anything! 👋</div>
        <div class="model-tag">gpt-4o-mini</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-wrap">

    <!-- Image options -->
    <div class="extra-opts" id="img-opts">
      <label>Model:</label>
      <select id="img-model">
        <option value="gpt-image-2">GPT Image 2</option>
        <option value="dall-e-3">DALL·E 3</option>
        <option value="dall-e-2">DALL·E 2</option>
      </select>
    </div>

    <!-- TTS options -->
    <div class="extra-opts" id="tts-opts">
      <label>Voice:</label>
      <select id="tts-voice">
        <option value="alloy">Alloy</option>
        <option value="nova">Nova</option>
        <option value="echo">Echo</option>
        <option value="onyx">Onyx</option>
        <option value="shimmer">Shimmer</option>
        <option value="fable">Fable</option>
      </select>
      <label>Model:</label>
      <select id="tts-model">
        <option value="tts-1">TTS-1</option>
        <option value="tts-1-hd">TTS-1 HD</option>
        <option value="gpt-4o-mini-tts">GPT-4o Mini TTS</option>
      </select>
    </div>

    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Type a message…"></textarea>
      <button id="send-btn" title="Send (Enter)">➤</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for new line</div>
  </div>

</div>

<script>
  // ── State ────────────────────────────────
  let mode = 'chat';
  let busy = false;

  const MODE_MODELS = {
    chat:   'gpt-4o-mini',
    code:   'openai/gpt-5.3-codex',
    search: 'gpt-4o',
  };

  const MODE_PLACEHOLDERS = {
    chat:   'Ask me anything…',
    code:   'Describe what to code — language, task, etc…',
    search: 'Search the web for anything…',
    image:  'Describe the image you want generated…',
    tts:    'Type the text you want converted to speech…',
  };

  const MODE_SYSTEM = {
    chat:   'You are a helpful, friendly AI assistant. Be clear and concise.',
    code:   'You are an expert coding assistant. Write clean, well-commented code. Always use fenced code blocks with the correct language tag.',
    search: 'You are an AI assistant with real-time web search access. Find up-to-date accurate answers. Reference your sources.',
  };

  // ── DOM ───────────────────────────────────
  const inputEl  = document.getElementById('input');
  const sendBtn  = document.getElementById('send-btn');
  const msgsEl   = document.getElementById('messages');
  const imgOpts  = document.getElementById('img-opts');
  const ttsOpts  = document.getElementById('tts-opts');

  // ── Tabs ──────────────────────────────────
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (busy) return;
      mode = tab.dataset.mode;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      inputEl.placeholder = MODE_PLACEHOLDERS[mode];
      imgOpts.classList.toggle('show', mode === 'image');
      ttsOpts.classList.toggle('show', mode === 'tts');
      inputEl.focus();
    });
  });

  // ── Textarea resize ───────────────────────
  inputEl.addEventListener('input', resize);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  function resize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
  }

  // ── Send ──────────────────────────────────
  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    addUserMsg(text);
    inputEl.value = '';
    resize();

    const typing = addTyping();

    try {
      if      (mode === 'image')  await doImage(text, typing);
      else if (mode === 'tts')    await doTTS(text, typing);
      else                        await doChat(text, typing);
    } catch (err) {
      typing.remove();
      addErrMsg(err.message || 'Something went wrong. Please try again.');
    }

    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── Chat / Code / Search ──────────────────
  async function doChat(text, typing) {
    const model = MODE_MODELS[mode];
    const opts  = { model, stream: true };

    if (mode === 'search') {
      opts.tools = [{ type: 'web_search' }];
    }

    const messages = [
      { role: 'system',  content: MODE_SYSTEM[mode] },
      { role: 'user',    content: text },
    ];

    const resp = await puter.ai.chat(messages, opts);

    typing.remove();
    const { bubble } = addAIMsg('', model);

    let full = '';
    for await (const part of resp) {
      if (part?.text) {
        full += part.text;
        bubble.textContent = full;
        scrollDown();
      }
    }
  }

  // ── Image generation ──────────────────────
  async function doImage(text, typing) {
    const model  = document.getElementById('img-model').value;
    const imgEl  = await puter.ai.txt2img(text, { model });

    typing.remove();

    const msg  = document.createElement('div');
    msg.className = 'msg ai';

    const right = document.createElement('div');

    const wrap = document.createElement('div');
    wrap.className = 'img-bubble';

    const cap = document.createElement('div');
    cap.style.cssText = 'font-size:11px;color:#555d7a;margin-bottom:4px';
    cap.textContent = '🎨 ' + text;

    const img = document.createElement('img');
    img.src = imgEl.src;
    img.alt = text;

    const dl = document.createElement('button');
    dl.className = 'dl-btn';
    dl.textContent = '⬇ Download';
    dl.onclick = () => downloadImg(imgEl.src);

    const tag = document.createElement('div');
    tag.className = 'model-tag';
    tag.textContent = model;

    wrap.appendChild(cap);
    wrap.appendChild(img);
    wrap.appendChild(dl);
    right.appendChild(wrap);
    right.appendChild(tag);

    msg.innerHTML = '<div class="avatar">✦</div>';
    msg.appendChild(right);
    msgsEl.appendChild(msg);
    scrollDown();
  }

  // ── Text to Speech ────────────────────────
  async function doTTS(text, typing) {
    const voice = document.getElementById('tts-voice').value;
    const model = document.getElementById('tts-model').value;

    const audioEl = await puter.ai.txt2speech(text, { provider: 'openai', voice, model });
    audioEl.setAttribute('controls', '');

    typing.remove();

    const msg = document.createElement('div');
    msg.className = 'msg ai';

    const right = document.createElement('div');

    const audioBubble = document.createElement('div');
    audioBubble.className = 'audio-bubble';

    const lbl = document.createElement('div');
    lbl.className = 'audio-label';
    lbl.textContent = `🔊 Voice: ${voice}`;

    audioBubble.appendChild(lbl);
    audioBubble.appendChild(audioEl);

    const tag = document.createElement('div');
    tag.className = 'model-tag';
    tag.textContent = model;

    right.appendChild(audioBubble);
    right.appendChild(tag);

    msg.innerHTML = '<div class="avatar">✦</div>';
    msg.appendChild(right);
    msgsEl.appendChild(msg);
    scrollDown();

    audioEl.play().catch(() => {});
  }

  // ── UI helpers ────────────────────────────
  function addUserMsg(text) {
    const msg = document.createElement('div');
    msg.className = 'msg user';

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = 'Me';

    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;

    msg.appendChild(av);
    msg.appendChild(b);
    msgsEl.appendChild(msg);
    scrollDown();
  }

  function addAIMsg(text, model) {
    const msg = document.createElement('div');
    msg.className = 'msg ai';

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '✦';

    const right = document.createElement('div');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const tag = document.createElement('div');
    tag.className = 'model-tag';
    tag.textContent = model || '';

    right.appendChild(bubble);
    right.appendChild(tag);
    msg.appendChild(av);
    msg.appendChild(right);
    msgsEl.appendChild(msg);
    scrollDown();
    return { msg, bubble };
  }

  function addErrMsg(text) {
    const { bubble } = addAIMsg('⚠️ ' + text, '');
    bubble.style.color = '#ff6b8a';
    bubble.style.background = '#2a1520';
    bubble.style.borderColor = '#4a1e2a';
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.innerHTML = `
      <div class="avatar">✦</div>
      <div class="bubble">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    msgsEl.appendChild(msg);
    scrollDown();
    return msg;
  }

  function scrollDown() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  async function downloadImg(src) {
    try {
      const res  = await fetch(src);
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = 'ai-image.png'; a.click();
      URL.revokeObjectURL(url);
    } catch {
      alert('Download failed. Right-click the image and save manually.');
    }
  }
</script>
</body>
</html>
