<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    background: #0f1117;
    color: #e8e8e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #chat-box {
    width: 100%;
    max-width: 680px;
    height: 100vh;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #161820;
    border-left: 1px solid #2a2d3a;
    border-right: 1px solid #2a2d3a;
  }

  /* Header */
  .header {
    padding: 16px 20px;
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #6c63ff;
    box-shadow: 0 0 8px #6c63ff;
  }

  .header h1 { font-size: 16px; font-weight: 600; }
  .header span { font-size: 12px; color: #888; margin-left: auto; }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 4px; }

  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }

  .msg.ai .avatar { background: linear-gradient(135deg, #6c63ff, #00d4aa); color: #fff; }
  .msg.user .avatar { background: #2a2d3a; color: #aaa; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
  }

  .msg.ai .bubble {
    background: #1e2130;
    border: 1px solid #2a2d3a;
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: #6c63ff;
    color: #fff;
    border-top-right-radius: 4px;
  }

  /* Typing dots */
  .typing { display: flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #6c63ff;
    animation: blink 1.2s infinite;
    display: block;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
    30% { opacity: 1; transform: scale(1.2); }
  }

  /* Input */
  .input-area {
    padding: 16px;
    border-top: 1px solid #2a2d3a;
    background: #1a1d27;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  textarea {
    flex: 1;
    background: #0f1117;
    border: 1px solid #2a2d3a;
    border-radius: 10px;
    color: #e8e8e8;
    font-size: 14px;
    font-family: inherit;
    padding: 10px 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
  }

  textarea:focus { border-color: #6c63ff; }
  textarea::placeholder { color: #555; }

  button {
    width: 44px; height: 44px;
    background: #6c63ff;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }

  button:hover { background: #7c75ff; }
  button:disabled { background: #333; cursor: default; }
</style>
</head>
<body>

<div id="chat-box">
  <div class="header">
    <div class="dot"></div>
    <h1>AI Chatbot</h1>
    <span>Powered by Puter.js</span>
  </div>

  <div id="messages">
    <div class="msg ai">
      <div class="avatar">AI</div>
      <div class="bubble">Hi! I'm your AI assistant. Ask me anything! 👋</div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="Type a message…" rows="1"></textarea>
    <button id="send-btn" title="Send">➤</button>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const messages = document.getElementById('messages');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Send on Enter (Shift+Enter for new line)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener('click', send);

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    // Show user message
    addMsg('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // Show typing indicator
    const typingEl = addTyping();

    try {
      // Call Puter AI — streaming
      const response = await puter.ai.chat(text, { model: 'gpt-4o-mini', stream: true });

      typingEl.remove();
      const aiEl = addMsg('ai', '');

      let full = '';
      for await (const part of response) {
        if (part?.text) {
          full += part.text;
          aiEl.textContent = full;
          scrollDown();
        }
      }
    } catch (err) {
      typingEl.remove();
      addMsg('ai', '⚠️ Error: ' + (err.message || 'Something went wrong.'));
    }

    sendBtn.disabled = false;
    input.focus();
    scrollDown();
  }

  function addMsg(role, text) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'ai' ? 'AI' : 'Me';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messages.appendChild(msg);
    scrollDown();
    return bubble;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        <div class="typing">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    messages.appendChild(msg);
    scrollDown();
    return msg;
  }

  function scrollDown() {
    messages.scrollTop = messages.scrollHeight;
  }
</script>
</body>
</html>
